[project]
name = "cert-ua-parser"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "beautifulsoup4>=4.15.0",
    "bitsandbytes>=0.50.2",
    "flagembedding>=1.4.2",
    "httpx>=0.28.1",
    "langdetect>=1.0.9",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "openai>=3.29.0",
    "pandas>=3.0.6",
    "pymorphy3>=2.0.6",
    "pymorphy3-dicts-uk>=2.4.1.1.1663094765",
    "rank-bm25>=0.2.2",
    "scipy>=1.18.1",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
